name: Release Artefacts

on:
  workflow_call:
    inputs:
      tag:
        description: Git tag to build and publish assets from
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_linux:
    name: Linux Pakete bauen
    runs-on: ubuntu-latest

    steps:
      - name: Repository am Release-Tag auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Linux Release bauen
        run: npm run build

      - name: Linux Artefakte hochladen
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-${{ inputs.tag }}
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error

  build_windows:
    name: Windows Pakete bauen
    runs-on: windows-latest

    steps:
      - name: Repository am Release-Tag auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Windows Release bauen
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Update-Manifest fuer portable Version erzeugen
        shell: pwsh
        run: |
          $portable = Get-ChildItem 'release/*-portable-*.exe' | Select-Object -First 1
          if (-not $portable) { throw 'Portable Windows artefact not found' }
          $package = Get-Content 'package.json' -Raw | ConvertFrom-Json
          $manifest = @{
            version = $package.version
            file = $portable.Name
            sha512 = (Get-FileHash -LiteralPath $portable.FullName -Algorithm SHA512).Hash.ToLowerInvariant()
          }
          $manifest | ConvertTo-Json | Set-Content 'release/portable-update.json' -Encoding utf8

      - name: Windows Artefakte hochladen
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-${{ inputs.tag }}
          path: |
            release/*-setup-*.exe
            release/*-portable-*.exe
            release/latest.yml
            release/portable-update.json
            release/*.blockmap
          if-no-files-found: error

  build_macos:
    name: macOS Pakete bauen
    runs-on: macos-latest

    steps:
      - name: Repository am Release-Tag auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: macOS Release bauen
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: macOS Artefakte hochladen
        uses: actions/upload-artifact@v7
        with:
          name: macos-release-${{ inputs.tag }}
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/*.blockmap
          if-no-files-found: error

  attach_assets:
    name: Artefakte ans Release haengen
    runs-on: ubuntu-latest
    needs:
      - build_linux
      - build_windows
      - build_macos

    steps:
      - name: Linux Artefakte herunterladen
        uses: actions/download-artifact@v8
        with:
          name: linux-release-${{ inputs.tag }}
          path: dist-artifacts/linux

      - name: Windows Artefakte herunterladen
        uses: actions/download-artifact@v8
        with:
          name: windows-release-${{ inputs.tag }}
          path: dist-artifacts/windows

      - name: macOS Artefakte herunterladen
        uses: actions/download-artifact@v8
        with:
          name: macos-release-${{ inputs.tag }}
          path: dist-artifacts/macos

      - name: Release-Dateien hochladen
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          files: |
            dist-artifacts/**/*.AppImage
            dist-artifacts/**/*.deb
            dist-artifacts/**/*.exe
            dist-artifacts/**/*.dmg
            dist-artifacts/**/*.zip
            dist-artifacts/**/*.yml
            dist-artifacts/**/portable-update.json
            dist-artifacts/**/*.blockmap

      - name: Vollstaendigen Release pruefen und veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          declare -A uploaded_assets=()
          while IFS= read -r asset; do
            uploaded_assets["$asset"]=1
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')

          expected_assets=(
            "kaderblick-analyse-player-${version}-linux-x86_64.AppImage"
            "kaderblick-analyse-player-${version}-linux-amd64.deb"
            "kaderblick-analyse-player-setup-${version}-x64.exe"
            "kaderblick-analyse-player-setup-${version}-x64.exe.blockmap"
            "kaderblick-analyse-player-portable-${version}-x64.exe"
            "kaderblick-analyse-player-${version}-mac-arm64.dmg"
            "kaderblick-analyse-player-${version}-mac-arm64.dmg.blockmap"
            "kaderblick-analyse-player-${version}-mac-arm64.zip"
            "kaderblick-analyse-player-${version}-mac-arm64.zip.blockmap"
            "latest-linux.yml"
            "latest.yml"
            "latest-mac.yml"
            "portable-update.json"
          )

          for expected_asset in "${expected_assets[@]}"; do
            if [[ -z "${uploaded_assets[$expected_asset]+present}" ]]; then
              echo "Fehlendes Release-Artefakt: $expected_asset" >&2
              exit 1
            fi
          done

          gh release edit "$RELEASE_TAG" --draft=false --latest
